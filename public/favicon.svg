<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#000000"/>

  <!-- "A" Letterform using JetBrains Mono inspired geometry -->
  <!-- Manually constructed path to mimic the font's clean, technical character -->
  <path d="M11 22L16 8L21 22" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Terminal Prompt Motif (_ cursor) as the crossbar -->
  <path d="M13.5 17.5H18.5" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Terminal Carrot (>) using technical Inter-style geometry -->
  <path d="M7 14L9 16L7 18" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
